schema_version: 1

site:
  name: boreddocs
  short_name: boreddocs
  url: https://www.boreddocs.com
  base_url: ""
  description: "Free, SEO- and AI-friendly static site for school board documents — agendas, minutes, and policies authored in Markdown. Like mkdocs, for school boards."
  repo_url: https://github.com/wroscoe/boreddocs
  pypi_url: https://pypi.org/project/boreddocs/

# These are present so the empty `meetings/` and `policies/` listings still
# build cleanly. The overridden home page links to GitHub / PyPI / docs only.
nav: []
footer: {}

theme:
  name: default

content:
  meetings_dir: content/meetings
  policies_dir: content/policies
  data_dir: data

output_dir: _site

<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ url('/') }}" aria-label="Home">⌂ Home</a></li>
    {% for crumb in crumbs %}
    <li>
      <span class="sep">›</span>
      {% if crumb.url %}<a href="{{ url(crumb.url) }}">{{ crumb.text }}</a>{% else %}<span>{{ crumb.text }}</span>{% endif %}
    </li>
    {% endfor %}
  </ol>
</nav>
